[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-only"
repository = "https://github.com/crussella0129/Animus_Periapsis"
publish = false

# Every dependency of a member crate is declared here and inherited with
# `<name>.workspace = true`, so licences and credits are checked in one place
# (`cargo policy`, rules `deps` and `credits`).
[workspace.dependencies]
blake3 = { version = "1.8.7", default-features = false, features = ["std", "pure"] }
sha2 = { version = "0.11.1", default-features = false }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
pulldown-cmark = { version = "0.13.6", default-features = false }
toml_edit = { version = "0.25.17", default-features = false, features = ["parse"] }
allocation-counter = "0.8.1"
getrandom = { version = "0.4.3", default-features = false }
ignore = { version = "0.4.34", default-features = false }
hash = { path = "crates/hash" }
book = { path = "crates/book" }
codec = { path = "crates/codec" }
sim = { path = "crates/sim" }
store = { path = "crates/store" }
workspace = { path = "crates/workspace" }

[workspace.lints.rust]
unsafe_code = "forbid"

# Tests build optimised: the simulation matrices run several times faster, and
# debug assertions and overflow checks keep their `dev` defaults (on). This is
# the only profile setting, which `cargo ci`'s pin test checks (INT-0003
# AC-11, Consequences).
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
