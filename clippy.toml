# Randomly seeded hash collections iterate in a different order on every run,
# which breaks canonical encodings and deterministic simulation (INT-0005 AC-4).
disallowed-types = [
    { path = "std::collections::HashMap", reason = "randomly seeded; use BTreeMap or a seeded hasher (INT-0005 AC-4)" },
    { path = "std::collections::HashSet", reason = "randomly seeded; use BTreeSet or a seeded hasher (INT-0005 AC-4)" },
]
